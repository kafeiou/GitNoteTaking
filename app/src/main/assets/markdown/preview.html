<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <link rel="stylesheet" href="github-markdown.css">
    <script src="marked.min.js"></script>
    <script src="mermaid.min.js"></script>
    <style>
        body {
            padding: 16px;
            margin: 0;
            user-select: text;
            -webkit-user-select: text;
            background-color: #ffffff;
            color: #24292f;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .dark-theme, html.dark-theme, html.dark-theme body {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        html.dark-theme .markdown-body {
            color: #e0e0e0 !important;
            background-color: #121212 !important;
        }
        html.dark-theme .markdown-body h1,
        html.dark-theme .markdown-body h2,
        html.dark-theme .markdown-body h3,
        html.dark-theme .markdown-body h4,
        html.dark-theme .markdown-body h5,
        html.dark-theme .markdown-body h6 {
            color: #ffffff !important;
            border-bottom-color: #30363d !important;
        }
        html.dark-theme .markdown-body a {
            color: #58a6ff !important;
        }
        html.dark-theme .markdown-body code {
            background-color: #1f242c !important;
            color: #ff7b72 !important;
        }
        html.dark-theme .markdown-body pre {
            background-color: #161b22 !important;
            border-color: #30363d !important;
        }
        html.dark-theme .markdown-body pre code {
            color: #e0e0e0 !important;
        }
        html.dark-theme .markdown-body table tr {
            background-color: #121212 !important;
            border-top-color: #30363d !important;
        }
        html.dark-theme .markdown-body table tr:nth-child(2n) {
            background-color: #161b22 !important;
        }
        html.dark-theme .markdown-body table th,
        html.dark-theme .markdown-body table td {
            border-color: #30363d !important;
            color: #e0e0e0 !important;
        }
        html.dark-theme .markdown-body blockquote {
            color: #8b949e !important;
            border-left-color: #30363d !important;
        }
        html.dark-theme .wikilink {
            color: #79c0ff !important;
            background-color: rgba(56, 139, 253, 0.15) !important;
        }
        #content {
            min-height: 100%;
        }
        .mermaid-diagram {
            display: flex;
            justify-content: center;
            margin: 16px 0;
            overflow-x: auto;
            max-width: 100%;
        }
        .mermaid-rendered {
            display: flex;
            justify-content: center;
            width: 100%;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="content" class="markdown-body"></div>

    <script>
        function setMarkdownContent(mdText, isDarkMode) {
            try {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark-theme');
                } else {
                    document.documentElement.classList.remove('dark-theme');
                }
                const html = marked.parse(mdText || "");
                document.getElementById('content').innerHTML = html;

                if (window.mermaid) {
                    try {
                        mermaid.initialize({ theme: isDarkMode ? 'dark' : 'default' });
                        mermaid.run();
                    } catch (mErr) {
                        console.error("Mermaid error:", mErr);
                    }
                }
            } catch (e) {
                document.getElementById('content').innerText = mdText || "";
            }
        }
    </script>
</body>
</html>
